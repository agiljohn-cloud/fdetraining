[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-concierge-agent"
version = "1.0.0"
description = "Autonomous Personal Meal Planning Concierge Agent built on Google ADK for the AI in 5 Days Assessment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Agil John", email = "agiljohn@google.com" }
]
dependencies = [
  "google-adk>=1.0.0",
  "google-genai>=1.0.0",
  "google-cloud-aiplatform>=1.70.0",
  "google-cloud-discoveryengine>=0.13.0",
  "google-cloud-dlp>=3.20.0",
  "google-cloud-secret-manager>=2.20.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-gcp-trace>=1.7.0",
  "pydantic>=2.7.0",
  "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
