name: Meal Concierge Agent CI & Golden Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Unit & Rubric Compliance Tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Golden Dataset & Trajectory Evaluation Harness
        run: python3 -m evals.evaluate_agent
